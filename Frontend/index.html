<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      SOVEREIGN BLACK ICE — AI Knowledge Integrity
    </title>

    <meta
      name="description"
      content="AI Knowledge Integrity and Document Change Impact Analysis Platform"
    />

    <meta
      property="og:title"
      content="SOVEREIGN BLACK ICE"
    />

    <meta
      property="og:description"
      content="AI Knowledge Integrity and Document Change Impact Analysis Platform"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- ========================= -->
    <!-- FONTS -->
    <!-- ========================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ========================= -->
    <!-- GLOBAL VISUAL THEME -->
    <!-- ========================= -->

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;

        font-family:
          "Space Grotesk",
          sans-serif;

        color: #172554;

        min-height: 100vh;

        background:
          radial-gradient(
            circle at 10% 15%,
            rgba(125, 211, 252, 0.65),
            transparent 28%
          ),
          radial-gradient(
            circle at 90% 10%,
            rgba(196, 181, 253, 0.75),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(251, 207, 232, 0.75),
            transparent 30%
          ),
          radial-gradient(
            circle at 20% 85%,
            rgba(165, 243, 252, 0.7),
            transparent 30%
          ),
          linear-gradient(
            135deg,
            #eff6ff 0%,
            #f5f3ff 32%,
            #ecfeff 62%,
            #fdf2f8 100%
          );

        background-attachment: fixed;

        overflow-x: hidden;
      }

      body::before {
        content: "";

        position: fixed;

        width: 420px;
        height: 420px;

        top: -160px;
        left: -100px;

        border-radius: 50%;

        background:
          linear-gradient(
            135deg,
            rgba(59, 130, 246, 0.30),
            rgba(6, 182, 212, 0.25)
          );

        filter: blur(70px);

        pointer-events: none;

        animation:
          floatBlob 10s ease-in-out infinite alternate;

        z-index: -1;
      }

      body::after {
        content: "";

        position: fixed;

        width: 480px;
        height: 480px;

        right: -170px;
        bottom: -180px;

        border-radius: 50%;

        background:
          linear-gradient(
            135deg,
            rgba(168, 85, 247, 0.30),
            rgba(236, 72, 153, 0.25)
          );

        filter: blur(80px);

        pointer-events: none;

        animation:
          floatBlobTwo 12s ease-in-out
          infinite alternate;

        z-index: -1;
      }

      #root {
        min-height: 100vh;
      }

      code,
      pre,
      .mono {
        font-family:
          "JetBrains Mono",
          monospace;
      }

      /* ========================= */
      /* SCROLLBAR */
      /* ========================= */

      ::-webkit-scrollbar {
        width: 9px;
      }

      ::-webkit-scrollbar-track {
        background: #eef2ff;
      }

      ::-webkit-scrollbar-thumb {
        background:
          linear-gradient(
            #6366f1,
            #8b5cf6,
            #ec4899
          );

        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background:
          linear-gradient(
            #3b82f6,
            #8b5cf6,
            #f43f5e
          );
      }

      /* ========================= */
      /* TEXT SELECTION */
      /* ========================= */

      ::selection {
        background: rgba(139, 92, 246, 0.25);
        color: #312e81;
      }

      /* ========================= */
      /* INTERACTIVE ELEMENTS */
      /* ========================= */

      button,
      a {
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          filter 0.25s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0) scale(0.98);
      }

      /* ========================= */
      /* INPUTS */
      /* ========================= */

      input,
      textarea,
      select {
        font-family:
          "Space Grotesk",
          sans-serif;

        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.25s ease;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;

        border-color: #8b5cf6 !important;

        box-shadow:
          0 0 0 4px
          rgba(139, 92, 246, 0.12) !important;
      }

      /* ========================= */
      /* GLASS EFFECT */
      /* ========================= */

      .glass {
        background:
          rgba(255, 255, 255, 0.72);

        backdrop-filter:
          blur(18px);

        -webkit-backdrop-filter:
          blur(18px);

        border:
          1px solid
          rgba(255, 255, 255, 0.75);

        box-shadow:
          0 20px 60px
          rgba(99, 102, 241, 0.12);
      }

      /* ========================= */
      /* GRADIENT TEXT */
      /* ========================= */

      .gradient-text {
        background:
          linear-gradient(
            90deg,
            #2563eb,
            #7c3aed,
            #db2777,
            #0891b2
          );

        background-size: 250% auto;

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;

        animation:
          gradientMove 5s linear infinite;
      }

      /* ========================= */
      /* GRADIENT BUTTON */
      /* ========================= */

      .gradient-button {
        color: white;

        border: none;

        background:
          linear-gradient(
            90deg,
            #2563eb,
            #7c3aed,
            #db2777
          );

        background-size: 200% auto;

        box-shadow:
          0 10px 30px
          rgba(124, 58, 237, 0.25);
      }

      .gradient-button:hover {
        background-position: right center;

        box-shadow:
          0 15px 35px
          rgba(219, 39, 119, 0.28);

        transform:
          translateY(-3px);
      }

      /* ========================= */
      /* GLOW CARD */
      /* ========================= */

      .glow-card {
        position: relative;

        background:
          rgba(255, 255, 255, 0.76);

        backdrop-filter:
          blur(18px);

        border:
          1px solid
          rgba(255, 255, 255, 0.85);

        box-shadow:
          0 16px 45px
          rgba(99, 102, 241, 0.10);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .glow-card:hover {
        transform:
          translateY(-5px);

        box-shadow:
          0 25px 60px
          rgba(124, 58, 237, 0.18);
      }

      /* ========================= */
      /* ANIMATIONS */
      /* ========================= */

      @keyframes gradientMove {
        0% {
          background-position:
            0% center;
        }

        100% {
          background-position:
            250% center;
        }
      }

      @keyframes floatBlob {
        from {
          transform:
            translate(0, 0)
            scale(1);
        }

        to {
          transform:
            translate(90px, 70px)
            scale(1.15);
        }
      }

      @keyframes floatBlobTwo {
        from {
          transform:
            translate(0, 0)
            scale(1);
        }

        to {
          transform:
            translate(-100px, -60px)
            scale(1.12);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;

          transform:
            translateY(16px);
        }

        to {
          opacity: 1;

          transform:
            translateY(0);
        }
      }

      .fade-up {
        animation:
          fadeUp 0.6s ease both;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
